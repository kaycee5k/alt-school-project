    <main>
        <section>
            <div>
    
                <form>
                    <h3>sign up</h3>
                    <p>
                        Take the next steps to apply at AltSchool Africa
                    </p>
                    <label for="text">First Name</label>
                    <input type="text" placeholder="Enter First Name">
                    <label for="text">Last Name</label>
                    <input type="text" placeholder="Enter Last Name">
                    <br>
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender">
                        <option value="" disabled selected>Select a gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                    <label >Date Of Birth</label>
                    <input type="date">
                    <br>
                    <label>Email</label>
                    <input type="email" placeholder="Enter Email">
                    <label>Phone Number</label>
                    <input type="tel">
                    <br>
                    <label for="country">Select your country:</label>
                    <select id="country" name="country" required>
                        <option value="" disabled selected>Select a Country</option>
                        <option value="nigeria">Nigeria</option>
                        <option value="united-states">United States</option>
                        <option value="canada">Canada</option>
                        <option value="germany">Germany</option>
                        <option value="india">India</option>
                        <option value="south-africa">South Africa</option>
                        <option value="australia">Australia</option>
                    </select>
                    <label for="city">State/City of Residence</label>
                    <input type="text"><br>
                    <label for="about us?">How did you hear about us?</label>
                    <select name="about us?" >
                        <option value="Twitter">Twitter</option>
                        <option value="Twitter">Linkdin</option>
                        <option value="Twitter">Facebook</option>
                        <option value="Twitter">Instagram</option>
                        <option value="Twitter">friends</option>
                        <option value="Twitter">Youtube</option>
                    </select><br>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <label for="password">Confirm Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </form>
            </div>
        </section>
    </main>
